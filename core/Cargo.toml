[package]
name = "core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compact pure transforms for the Dyam Marcano tools modal"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qrcodegen = "1.8.0"
wasm-bindgen = "0.2.126"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
